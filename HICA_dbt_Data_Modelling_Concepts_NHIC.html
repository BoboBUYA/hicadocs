<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HICA · Data Modelling with dbt</title>
<style>
  :root { --navy:#0B2D5C; --blue:#355183; --ink:#2F3A4D; --line:#9DB4D4; --tint:#EEF3FA; --bg:#F5F8FC; --yellow:#F7E637; --code:#8FB3E3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#DCE4EF; font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif; color:var(--ink); }
  body { display:flex; flex-direction:column; overflow:hidden; }

  /* toolbar */
  .bar { flex:0 0 56px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 16px; background:var(--navy); color:#fff; }
  .bar .brand { font:600 15px/1.2 'Gill Sans','Gill Sans MT','Trebuchet MS',Calibri,sans-serif; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tabs { display:flex; gap:4px; background:rgba(255,255,255,.12); padding:4px; border-radius:10px; }
  .tabs button { all:unset; cursor:pointer; padding:6px 14px; border-radius:7px; font:600 14px/1 'Gill Sans','Gill Sans MT','Trebuchet MS',Calibri,sans-serif; color:#DCE7F7; }
  .tabs button:hover { background:rgba(255,255,255,.14); }
  .tabs button[aria-selected="true"] { background:var(--yellow); color:var(--navy); }
  .tabs button:focus-visible, .ctrl button:focus-visible { outline:2px solid #fff; outline-offset:2px; }

  /* stage */
  .view { flex:1 1 auto; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .frame { position:relative; box-shadow:0 8px 30px rgba(11,45,92,.25); background:#fff; }
  .slide { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; background:var(--bg); overflow:hidden; display:none; }
  .slide.active { display:block; }
  .slide.cover { background:#fff; }

  .ctrl { flex:0 0 56px; display:flex; align-items:center; justify-content:center; gap:14px; background:#fff; border-top:1px solid var(--line); }
  .ctrl button { all:unset; cursor:pointer; padding:8px 16px; border-radius:8px; background:var(--navy); color:#fff; font:600 14px/1 'Gill Sans','Gill Sans MT','Trebuchet MS',Calibri,sans-serif; }
  .ctrl button:disabled { opacity:.35; cursor:default; }
  .ctrl .count { min-width:120px; text-align:center; font:600 15px/1 'Gill Sans','Gill Sans MT','Trebuchet MS',Calibri,sans-serif; color:var(--navy); }
  .ctrl .alt { background:var(--tint); color:var(--navy); border:1px solid var(--line); }

  .card { background:#fff; border:1px solid var(--line); border-radius:34px; }
  .card.tint { background:var(--tint); }
  .card.hot { background:#fff; border:3px solid var(--navy); }
  .num { border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font:700 30px/1 'Gill Sans','Gill Sans MT','Trebuchet MS',Calibri,sans-serif; }
  .ct { font:700 43px/1.15 'Gill Sans','Gill Sans MT','Trebuchet MS',Calibri,sans-serif; color:var(--navy); }

  .tag { background:var(--yellow); color:var(--navy); border-radius:30px; display:flex; align-items:center; justify-content:center; font:700 21px/1 'Gill Sans','Gill Sans MT','Trebuchet MS',Calibri,sans-serif; }

  .codeblock div { white-space:pre; }

  table.t { border-collapse:collapse; table-layout:fixed; width:1008px; }
  table.t th { background:var(--navy); color:#fff; text-align:left; padding:0 18px; font:700 27px/1.2 'Gill Sans','Gill Sans MT','Trebuchet MS',Calibri,sans-serif; border-bottom:1px solid var(--line); }
  table.t td { padding:0 18px; border-bottom:1px solid var(--line); font:400 27px/1.2 Calibri,Carlito,'Segoe UI',sans-serif; color:var(--ink); }
  table.t td:first-child { font:700 27px/1.2 'Gill Sans','Gill Sans MT','Trebuchet MS',Calibri,sans-serif; color:var(--navy); }
  table.t tr:nth-child(odd) td { background:#fff; }
  table.t tr:nth-child(even) td { background:var(--tint); }

    d.cards.forEach(function (c, i) {
      h += '<div class="abs card" style="left:' + xs[i] + 'px;top:230px;width:566px;height:566px"></div>' +
        '<div class="abs num" style="left:' + (xs[i] + 48) + 'px;top:278px;width:96px;height:96px;font-size:40px">' + (i + 1) + '</div>' +
        '<div class="abs ct" style="left:' + (xs[i] + 48) + 'px;top:403px;width:470px">' + esc(x(c[0])) + '</div>' +
        '<div class="abs cb" style="left:' + (xs[i] + 48) + 'px;top:518px;width:470px">' + esc(x(c[1])) + '</div>';
    });
    return h + callout(d.callout, 849);
  }
  function sBullets(d) {
    var h = chrome() + head(d) + '<div class="abs tag" style="left:1291px;top:57px;width:297px;height:59px">' + esc(x(d.tag)) + '</div>', xs = [72, 974];
    d.cols.forEach(function (c, i) {
      h += '<div class="abs card" style="left:' + xs[i] + 'px;top:187px;width:873px;height:633px"></div>' +
        '<div class="abs ct" style="left:' + (xs[i] + 43) + 'px;top:216px;width:787px;font-size:40px">' + esc(x(c.head)) + '</div>' +
        '<ul class="abs b" style="left:' + (xs[i] + 43) + 'px;top:312px;width:787px">' + c.items.map(function (t) { return '<li>' + esc(x(t)) + '</li>'; }).join('') + '</ul>';
    });
    return h + callout(d.callout, 859);
  }
  function sLayers(d) {
    var h = chrome() + head(d), xs = [72, 432, 792, 1152, 1512];
    d.cards.forEach(function (c, i) {
      var hot = i === 4;
      h += '<div class="abs card ' + (hot ? 'hot' : 'tint') + '" style="left:' + xs[i] + 'px;top:230px;width:336px;height:566px"></div>' +
        '<div class="abs num" style="left:' + (xs[i] + 33) + 'px;top:264px;width:76px;height:76px;font-size:32px">' + (i + 1) + '</div>' +
        '<div class="abs ct" style="left:' + (xs[i] + 33) + 'px;top:369px;width:278px;font-size:33px">' + esc(x(c.name)) + '</div>' +
        '<div class="abs mono" style="left:' + (xs[i] + 33) + 'px;top:456px;width:278px;font-size:20px;line-height:1.2;color:var(--blue)">' + c.mono.map(function (m) { return '<div>' + esc(x(m)) + '</div>'; }).join('') + '</div>' +
        '<div class="abs cb" style="left:' + (xs[i] + 33) + 'px;top:628px;width:278px;font-size:28px;line-height:1.12">' + esc(x(c.desc)) + '</div>';
    });
    return h + callout(d.callout, 849);
  }
  function sCodeTable(d) {
    var h = chrome() + head(d);
    h += code(d.code, { box: 'left:72px;top:201px;width:729px;height:547px', fs: d.fs, lh: d.lh });
    h += table(d.table, 201, d.rowH, 70);
    return h + callout(d.callout, 883);
  }
  function sCardsCode(d) {
    var h = chrome() + head(d), xs = [72, 676, 1281];
    d.cards.forEach(function (c, i) {
      h += '<div class="abs card" style="left:' + xs[i] + 'px;top:206px;width:566px;height:316px;border-radius:30px"></div>' +
        '<div class="abs num" style="left:' + (xs[i] + 38) + 'px;top:235px;width:76px;height:76px;font-size:32px">' + (i + 1) + '</div>' +
        '<div class="abs ct' + (c.mono ? ' mono' : '') + '" style="left:' + (xs[i] + 144) + 'px;top:235px;width:403px;height:76px;display:flex;align-items:center;font-size:' + (c.mono ? 32 : 36) + 'px">' + esc(x(c.t)) + '</div>' +
        '<div class="abs cb" style="left:' + (xs[i] + 38) + 'px;top:340px;width:489px;font-size:28px;line-height:1.1">' + esc(x(c.b)) + '</div>';
    });
    h += code(d.code, { box: 'left:72px;top:552px;width:1075px;height:316px', fs: 27, lh: 1.4 });
    h += '<div class="abs" style="left:1176px;top:552px;width:672px;height:316px;background:var(--tint);border:1px solid var(--line);border-radius:20px;padding:28px 38px;font:400 29px/1.2 Calibri,Carlito,sans-serif;color:var(--ink)">' +
      '<p style="margin-bottom:18px"><b class="mono" style="color:var(--navy)">' + esc(d.note[0]) + '</b>' + esc(x(d.note[1])) + '</p><p><b style="color:var(--navy)">' + esc(x(d.note[2])) + '</b></p></div>';
    return h;
  }
  function sSteps(d) {
    var h = chrome() + head({ title: d.title }), ys = [177, 422, 667];
    d.steps.forEach(function (s, i) {
      h += '<div class="abs num" style="left:72px;top:' + ys[i] + 'px;width:86px;height:86px;font-size:36px">' + (i + 1) + '</div>' +
        '<div class="abs ct" style="left:187px;top:' + ys[i] + 'px;width:480px;height:86px;display:flex;align-items:center;font-size:37px">' + esc(x(s[0])) + '</div>' +
        '<div class="abs cb" style="left:187px;top:' + (ys[i] + 96) + 'px;width:499px;font-size:28px;line-height:1.1">' + esc(x(s[1])) + '</div>';
    });
    return h + code(d.code, { box: 'left:720px;top:177px;width:1128px;height:662px', fs: 27, lh: 1.55 });
  }

  var B = { cover: sCover, cards3: sCards3, bullets: sBullets, layers: sLayers, codetable: sCodeTable, cardscode: sCardsCode, steps: sSteps };

  var frame = document.getElementById('frame'), slides = [];
  C.forEach(function () { var d = document.createElement('div'); d.className = 'slide'; frame.appendChild(d); slides.push(d); });

  function render() {
    document.documentElement.lang = LANGS[li];
    document.title = TITLE[LANGS[li]];
    var u = UI[LANGS[li]];
    document.getElementById('brand').textContent = u.brand;
    document.getElementById('prev').textContent = u.prev;
    document.getElementById('next').textContent = u.next;
    document.getElementById('full').textContent = u.full;
    document.getElementById('print').textContent = u.print;
    C.forEach(function (d, i) {
      slides[i].className = 'slide' + (d.kind === 'cover' ? ' cover' : '') + (i === cur ? ' active' : '');
      slides[i].innerHTML = B[d.kind](d);
    });
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.getAttribute('data-lang') === LANGS[li] ? 'true' : 'false'); });
    update();
  }
  function update() {
    slides.forEach(function (s, i) { s.classList.toggle('active', i === cur); });
    var u = UI[LANGS[li]];
    document.getElementById('count').textContent = u.slide + ' ' + (cur + 1) + ' ' + u.of + ' ' + C.length;
    document.getElementById('prev').disabled = cur === 0;
    document.getElementById('next').disabled = cur === C.length - 1;
    try { history.replaceState(null, '', '#' + LANGS[li] + '/' + (cur + 1)); } catch (e) {}
  }
  function fit() {
    var v = document.getElementById('view'), w = v.clientWidth - 24, h = v.clientHeight - 24;
    var s = Math.min(w / 1920, h / 1080); if (s <= 0) s = 0.1;
    frame.style.width = (1920 * s) + 'px'; frame.style.height = (1080 * s) + 'px';
    slides.forEach(function (d) { d.style.transform = 'scale(' + s + ')'; });
  }
  function go(n) { cur = Math.max(0, Math.min(C.length - 1, n)); update(); }
  function setLang(l) { li = Math.max(0, LANGS.indexOf(l)); render(); }

  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); }); });
  document.getElementById('prev').addEventListener('click', function () { go(cur - 1); });
  document.getElementById('next').addEventListener('click', function () { go(cur + 1); });
  document.getElementById('full').addEventListener('click', function () {
    var el = document.documentElement;
    if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); } else { document.exitFullscreen(); }
  });
  document.getElementById('print').addEventListener('click', function () { window.print(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(C.length - 1);
    else if (e.key === 'f' || e.key === 'F') document.getElementById('full').click();
  });
  var tx = null;
  document.getElementById('view').addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  document.getElementById('view').addEventListener('touchend', function (e) {
    if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
  });
  window.addEventListener('resize', fit);

  var m = /^#(en|fr|pt)\/(\d+)$/.exec(location.hash);
  if (m) { li = LANGS.indexOf(m[1]); cur = Math.max(0, Math.min(C.length - 1, parseInt(m[2], 10) - 1)); }
  render(); fit();
})();
</script>
</body>
</html>
